# ============================================================
# api.modouyu.top — 报数机器人AI API 反代
# 容器后端：127.0.0.1:8001（仅本机访问，Docker 映射 Jinribao 项目）
# 证书：Let's Encrypt → /etc/letsencrypt/live/api.modouyu.top/
# 部署：sudo cp deploy/nginx.conf /etc/nginx/sites-available/api.modouyu.top
#       sudo ln -sf /etc/nginx/sites-available/api.modouyu.top /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#       sudo certbot --nginx -d api.modouyu.top
# ============================================================

# HTTP → 301 到 HTTPS（唯一例外：ACME 验证路径）
server {
    listen 80;
    listen [::]:80;
    server_name api.modouyu.top;

    # Let's Encrypt 验证（certbot 自动创建）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/jinribao-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # 其余跳 HTTPS
    location / {
        return 301 https://api.modouyu.top$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.modouyu.top;

    # ---- TLS（首次先不带这 6 行跑通 80→301，certbot 自动补 cert）----
    ssl_certificate     /etc/letsencrypt/live/api.modouyu.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.modouyu.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    access_log /var/log/nginx/api.modouyu.top.access.log;
    error_log  /var/log/nginx/api.modouyu.top.error.log warn;

    # 小程序上传上限（表单提交 JSON，不会太大；这里留 2M 缓冲）
    client_max_body_size 2m;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- gzip（API JSON 响应）----
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # ---- 所有路径反代到 FastAPI ----
    # API 入口（带 Bearer JWT）
    location /api {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }

    # 微信登录端点（不带 /api 前缀，独立路径）
    location /auth/login {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # 健康检查（微信小程序可以配域名前先手动 curl 验证）
    location = /health {
        proxy_pass         http://127.0.0.1:8001/health;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto https;
        add_header Cache-Control "no-store";
    }
}
