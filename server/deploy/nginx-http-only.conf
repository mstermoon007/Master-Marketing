# ============================================================
# api.modouyu.top — 报数机器人AI API
# 初始 HTTP-only 配置；certbot --nginx 后会自动补全 HTTPS 块
# ============================================================

# HTTP：ACME 验证 + 反代后端（certbot 会自动改成 301→HTTPS）
server {
    listen 80;
    listen [::]:80;
    server_name api.modouyu.top;

    access_log /var/log/nginx/api.modouyu.top.access.log;
    error_log  /var/log/nginx/api.modouyu.top.error.log warn;

    # Let's Encrypt 验证
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/jinribao-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # 后端 API（临时 HTTP 反代，certbot 后会移到 HTTPS 块）
    location /api {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /auth/login {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
    }
}
