# ============================================================
# api.modouyu.top — 报数机器人AI API 反代
# 后端：jinribao_backend 容器 (127.0.0.1:8001, gunicorn+uvicorn)
# 证书：Let's Encrypt (certbot managed，到期 2027-02-08)
# 部署：sudo cp deploy/nginx-full.conf /etc/nginx/sites-available/api.modouyu.top
#       sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# --- HTTP: 301 → HTTPS + ACME 验证 ---
server {
    listen 80;
    listen [::]:80;
    server_name api.modouyu.top;

    access_log /var/log/nginx/api.modouyu.top.access.log;
    error_log  /var/log/nginx/api.modouyu.top.error.log warn;

    # Let's Encrypt 验证路径
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/jinribao-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # 其余全部 301 到 HTTPS
    location / {
        return 301 https://api.modouyu.top$request_uri;
    }
}

# --- HTTPS: 主 API 反代 ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.modouyu.top;

    # ---- TLS（certbot managed，请勿手动修改证书路径）----
    ssl_certificate     /etc/letsencrypt/live/api.modouyu.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.modouyu.top/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/api.modouyu.top.access.log;
    error_log  /var/log/nginx/api.modouyu.top.error.log warn;

    client_max_body_size 2m;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- gzip（API JSON 响应压缩）----
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # ---- FastAPI 反代（单实例：127.0.0.1:8001）----
    # 将来多实例扩展时，把下面 proxy_pass 换成 upstream 块（需放 /etc/nginx/conf.d/）

    # 业务 API 入口（带 Bearer JWT）
    location /api {
        proxy_pass          http://127.0.0.1:8001;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
        proxy_send_timeout    15s;
    }

    # 微信登录端点
    location /auth/login {
        proxy_pass          http://127.0.0.1:8001;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }

    # 健康检查（不缓存，供微信配置域名前手动验证）
    location = /health {
        proxy_pass          http://127.0.0.1:8001/health;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Forwarded-Proto https;
        add_header Cache-Control "no-store";
        access_log off;
    }
}
