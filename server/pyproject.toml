[tool.ruff]
# 与服务端运行时保持一致（Python 3.13）；行长只约束新代码，存量不强制重排。
target-version = "py313"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
# 只保留「确定是问题」的规则：语法/未定义名/未使用导入/导入顺序。
# 不启用格式化类规则（UP/SIM/DTZ 等），避免一次性大改存量代码。
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
# 依赖没有 type stub（pymysql 等），不因此阻断检查。
ignore_missing_imports = true
# 存量函数大量未标注：只检查已有注解的函数，作为渐进式护栏，不阻断历史代码。
check_untyped_defs = false
no_error_summary = true
exclude = "(^|/)(\\.venv|tests)/"
